<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>法律风险快速自测 | 内蒙古鑫阳律师事务所</title>
<script src="proxy-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#111;min-height:100vh}
.container{max-width:520px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0 16px}
.header .badge{display:inline-block;background:#0b3d7b;color:#fff;padding:6px 16px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:10px}
.header h1{font-size:26px;font-weight:800;color:#0b3d7b;margin-bottom:4px}
.header .sub{font-size:14px;color:#6b7c93}

/* 问题卡片 - 极简 */
.q-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;border:2px solid #e8ecf2;cursor:pointer}
.q-card.checked{border-color:#0b3d7b;background:#eef3fa}
.q-text{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:10px}
.q-ops{display:flex;gap:10px}
.q-ops div{flex:1;text-align:center;padding:12px;border-radius:10px;font-size:17px;font-weight:600;border:2px solid #d1d9e6;color:#6b7c93;background:#f9fafb;transition:all .2s;-webkit-tap-highlight-color:transparent}
.q-ops div.sel{border-color:#0b3d7b;color:#0b3d7b;background:#dbeafe}

/* 进度条 */
.pb{margin-bottom:14px}
.pb-text{font-size:13px;color:#6b7c93;text-align:center;margin-bottom:4px}
.pb-bar{height:5px;background:#e2e6ed;border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:linear-gradient(90deg,#0b3d7b,#2563eb);border-radius:3px;transition:width .3s}

/* 提交按钮 */
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:700;color:#fff;background:#0b3d7b;cursor:pointer;margin-top:6px;transition:opacity .2s}
.btn:disabled{opacity:.4}
.btn:active{opacity:.8}

/* 结果区 */
.result{display:none;margin-top:16px}
.result.show{display:block}
.score-box{text-align:center;padding:20px;background:#fff;border-radius:14px;border:2px solid #e8ecf2}
.score-num{font-size:48px;font-weight:800;color:#0b3d7b}
.score-label{font-size:16px;color:#6b7c93;margin-top:4px}
.tag{display:inline-block;padding:4px 16px;border-radius:20px;font-size:14px;font-weight:700;margin-top:8px}
.tag-low{background:#d1fae5;color:#065f46}
.tag-mid{background:#fef3c7;color:#92400e}
.tag-high{background:#fee2e2;color:#991b1b}
.tag-critical{background:#fce4ec;color:#b71c1c}

/* 联系表 */
.form{background:#fff;border-radius:12px;padding:16px;margin-top:12px}
.form h3{font-size:17px;font-weight:700;margin-bottom:10px}
.form input{width:100%;padding:14px;border:2px solid #e2e6ed;border-radius:10px;font-size:16px;margin-bottom:10px;outline:none}
.form input:focus{border-color:#0b3d7b}
.form .tips{font-size:12px;color:#8a99b4;text-align:center;margin-top:10px}
</style></head><body>
<div class="container">
  <div class="header">
    <div class="badge">法律风险自测</div>
    <h1>你的企业有这些隐患吗？</h1>
    <div class="sub">8个问题 · 1分钟测完</div>
  </div>

  <div class="pb"><div class="pb-text"><span id="pq">0</span>/8</div><div class="pb-bar"><div class="pb-fill" id="pf" style="width:0%"></div></div></div>

  <div id="questions"></div>

  <button class="btn" id="seeBtn" onclick="calcScore()" style="display:none">查看风险</button>

  <div class="result" id="result">
    <div class="score-box">
      <div class="score-num"><span id="sp">0</span>%</div>
      <div class="score-label">风险指数</div>
      <div class="tag" id="tag"></div>
    </div>

    <div class="form" id="form">
      <h3>获取风险分析报告</h3>
      <input type="text" id="regionInp" placeholder="公司所在区域（必填）" maxlength="50">
      <input type="text" id="nameInp" placeholder="您的姓氏（必填）" maxlength="4">
      <input type="tel" id="phoneInp" placeholder="手机号码（必填）" maxlength="11">
      <input type="text" id="otherInp" placeholder="其他问题（选填）">
      <button class="btn" id="subBtn" onclick="submit()">获取免费报告</button>
      <div class="tips">内蒙古鑫阳律师事务所 · 信息仅用于法律服务对接</div>
    </div>
  </div>
</div>

<script>
const QS=[
  {id:'q1',sec:'股权',text:'股权随口定的，有人想退出算不清'},
  {id:'q2',sec:'股权',text:'小股东要求查账被拒，正在闹'},
  {id:'q3',sec:'股权',text:'股权挂在配偶/父母名下，万一闹翻了说不清'},
  {id:'q4',sec:'股权',text:'增资扩股后，你一票否决权没了'},
  {id:'q5',sec:'债务',text:'煤款/工程款被拖超一年，对方快不行了'},
  {id:'q6',sec:'债务',text:'给朋友担保，对方还不上找你了'},
  {id:'q7',sec:'债务',text:'公司没钱了，债主盯上你个人资产'},
  {id:'q8',sec:'公司',text:'注册资金认缴5000万，五年实缴不够'},
];
const ANSW={};

function renderQs(){
  let h='';
  QS.forEach(q=>{
    h+=`<div class="q-card" id="c${q.id}" onclick="toggle('${q.id}')">
      <div class="q-text">${q.text}</div>
      <div class="q-ops">
        <div id="${q.id}y" onclick="event.stopPropagation();pick('${q.id}','y')">有</div>
        <div id="${q.id}n" onclick="event.stopPropagation();pick('${q.id}','n')">没有</div>
      </div>
    </div>`;
  });
  document.getElementById('questions').innerHTML=h;
}

function toggle(id){
  const c=document.getElementById('c'+id);
  if(ANSW[id]==='y'){ANSW[id]='n';document.getElementById(id+'y').classList.remove('sel');document.getElementById(id+'n').classList.add('sel')}
  else{ANSW[id]='y';document.getElementById(id+'y').classList.add('sel');document.getElementById(id+'n').classList.remove('sel')}
  c.classList.toggle('checked');updatePb();
}

function pick(id,v){
  ANSW[id]=v;
  const y=document.getElementById(id+'y'),n=document.getElementById(id+'n');
  y.classList.toggle('sel',v==='y');
  n.classList.toggle('sel',v==='n');
  document.getElementById('c'+id).classList.toggle('checked',v==='y');
  updatePb();
}

function updatePb(){
  const n=Object.keys(ANSW).length;
  document.getElementById('pq').textContent=n;
  document.getElementById('pf').style.width=Math.round(n/8*100)+'%';
  document.getElementById('seeBtn').style.display=n>0?'block':'none';
}

function calcScore(){
  const hits=QS.filter(q=>ANSW[q.id]==='y');
  const pct=Math.round(hits.length/8*100);
  document.getElementById('sp').textContent=pct;
  const t=document.getElementById('tag');
  let lv;
  if(pct<=25){lv='低风险';t.className='tag tag-low'}
  else if(pct<=50){lv='中等风险';t.className='tag tag-mid'}
  else if(pct<=75){lv='高风险';t.className='tag tag-high'}
  else{lv='严重风险';t.className='tag tag-critical'}
  t.textContent=lv;
  document.getElementById('result').classList.add('show');
  document.getElementById('form').scrollIntoView({behavior:'smooth'});
}

async function submit(){
  const region=document.getElementById('regionInp').value.trim();
  const name=document.getElementById('nameInp').value.trim();
  const phone=document.getElementById('phoneInp').value.trim();
  if(!region){alert('请输入公司所在区域');return}
  if(!name){alert('请输入您的姓氏');return}
  if(!phone||phone.length<11){alert('请输入正确的手机号码');return}
  const other=document.getElementById('otherInp').value.trim();
  const hits=QS.filter(q=>ANSW[q.id]==='y');
  const pct=Math.round(hits.length/8*100);
  let lv;
  if(pct<=25)lv='低风险';
  else if(pct<=50)lv='中等风险';
  else if(pct<=75)lv='高风险';
  else lv='严重风险';

  const btn=document.getElementById('subBtn');
  btn.disabled=true;btn.textContent='提交中...';

  const detail=QS.map(q=>`${q.id}:${ANSW[q.id]==='y'?'命中':'无'}`).join(', ');
  const time=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});

  try{
    await fetch(PROXY_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{
        '公司所在区域':region,
        '姓氏':name,
        '手机号':phone,
        '风险得分':hits.length,
        '风险百分比':pct,
        '风险等级':lv,
        '风险板块':'快速筛查',
        '其他法律问题':other||'无',
        '提交时间':time,
        '答题详情':detail,
      }})
    });
  }catch(e){console.log(e)}

  btn.textContent='提交成功 ✓';
  document.getElementById('regionInp').value='';
  document.getElementById('nameInp').value='';
  document.getElementById('phoneInp').value='';
  document.getElementById('otherInp').value='';
}

renderQs();
</script></body></html>
